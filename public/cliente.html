<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Navalha de Ouro — Agendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/estilo.css">
</head>

<body>
    <div class="stripes"></div>
    <header>
        <h1>Navalha de Ouro</h1>
        <div class="sub">Agende seu horário</div>
    </header>

    <main>
        <section class="card">
            <h2>Novo agendamento</h2>
            <form id="formAgendamento">
                <div class="full">
                    <label for="cliente">Seu nome</label>
                    <input type="text" id="cliente" required>
                </div>
                <div>
                    <label for="telefone">Telefone / WhatsApp</label>
                    <input type="tel" id="telefone" placeholder="(43) 90000-0000">
                </div>
                <div>
                    <label for="email">E-mail (pra confirmação)</label>
                    <input type="email" id="email" placeholder="opcional">
                </div>
                <div>
                    <label for="barbeiro">Barbeiro</label>
                    <select id="barbeiro" required></select>
                </div>
                <div>
                    <label for="servico">Serviço</label>
                    <select id="servico" required></select>
                </div>
                <div class="full">
                    <label>Data</label>
                    <div id="calendario" class="calendario">
                        <div class="calendario-topo">
                            <button type="button" id="mesAnterior" class="calendario-nav">‹</button>
                            <span id="calendarioMesAno"></span>
                            <button type="button" id="mesSeguinte" class="calendario-nav">›</button>
                        </div>
                        <div class="calendario-semana">
                            <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
                        </div>
                        <div id="calendarioDias" class="calendario-dias"></div>
                    </div>
                    <input type="hidden" id="data" required>
                </div>
                <div>
                    <label for="hora">Horário</label>
                    <input type="time" id="hora" required>
                </div>
                <div class="msg" id="msgForm"></div>
                <button type="submit" class="btn-primary">Confirmar agendamento</button>
            </form>
        </section>
    </main>

    <script>
        const formAgendamento = document.getElementById('formAgendamento');
        const selectBarbeiro = document.getElementById('barbeiro');
        const selectServico = document.getElementById('servico');
        const inputData = document.getElementById('data');
        const msgForm = document.getElementById('msgForm');

        let servicos = [];
        let diasFechados = [];
        let mesAtual = new Date();
        mesAtual.setDate(1);

        const nomesMeses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

        function formatarDataLocal(d) {
            const ano = d.getFullYear();
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const dia = String(d.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        function renderCalendario() {
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);

            document.getElementById('calendarioMesAno').textContent =
                `${nomesMeses[mesAtual.getMonth()]} ${mesAtual.getFullYear()}`;

            const primeiroDiaSemana = new Date(mesAtual.getFullYear(), mesAtual.getMonth(), 1).getDay();
            const totalDias = new Date(mesAtual.getFullYear(), mesAtual.getMonth() + 1, 0).getDate();

            const container = document.getElementById('calendarioDias');
            container.innerHTML = '';

            for (let i = 0; i < primeiroDiaSemana; i++) {
                container.appendChild(document.createElement('span'));
            }

            for (let dia = 1; dia <= totalDias; dia++) {
                const dataDia = new Date(mesAtual.getFullYear(), mesAtual.getMonth(), dia);
                const diaSemana = dataDia.getDay();
                const passou = dataDia < hoje;
                const fechado = diasFechados.includes(diaSemana);
                const indisponivel = passou || fechado;

                const botao = document.createElement('button');
                botao.type = 'button';
                botao.textContent = dia;
                botao.className = 'calendario-dia' + (indisponivel ? ' indisponivel' : '');
                if (inputData.value === formatarDataLocal(dataDia)) botao.classList.add('selecionado');

                if (!indisponivel) {
                    botao.addEventListener('click', () => {
                        inputData.value = formatarDataLocal(dataDia);
                        renderCalendario();
                    });
                } else {
                    botao.disabled = true;
                }

                container.appendChild(botao);
            }
        }

        document.getElementById('mesAnterior').addEventListener('click', () => {
            mesAtual.setMonth(mesAtual.getMonth() - 1);
            renderCalendario();
        });
        document.getElementById('mesSeguinte').addEventListener('click', () => {
            mesAtual.setMonth(mesAtual.getMonth() + 1);
            renderCalendario();
        });

        async function carregarOpcoes() {
            const [barbeiros, servs, config] = await Promise.all([
                fetch('/api/barbeiros').then(r => r.json()),
                fetch('/api/servicos').then(r => r.json()),
                fetch('/api/configuracao').then(r => r.json())
            ]);
            servicos = servs;
            diasFechados = config.diasFechados || [];
            selectBarbeiro.innerHTML = barbeiros.map(b => `<option value="${b}">${b}</option>`).join('');
            selectServico.innerHTML = servs.map(s => `<option value="${s.nome}">${s.nome} — ${s.duracao}min — R$${s.preco}</option>`).join('');
            renderCalendario();
        }

        formAgendamento.addEventListener('submit', async (e) => {
            e.preventDefault();
            msgForm.className = 'msg';
            msgForm.textContent = '';

            if (!inputData.value) {
                msgForm.className = 'msg erro';
                msgForm.textContent = 'Escolha uma data no calendário.';
                return;
            }

            const corpo = {
                cliente: document.getElementById('cliente').value.trim(),
                telefone: document.getElementById('telefone').value.trim(),
                email: document.getElementById('email').value.trim(),
                barbeiro: selectBarbeiro.value,
                servico: selectServico.value,
                data: inputData.value,
                hora: document.getElementById('hora').value
            };

            try {
                const resposta = await fetch('/api/agendamentos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(corpo)
                });
                const dados = await resposta.json();

                if (!resposta.ok) {
                    msgForm.className = 'msg erro';
                    msgForm.textContent = dados.erro || 'Não deu pra agendar. Tente outro horário.';
                    return;
                }

                msgForm.className = 'msg sucesso';
                msgForm.textContent = 'Agendamento confirmado com sucesso! Te esperamos por aqui.';
                formAgendamento.reset();
                inputData.value = '';
                renderCalendario();
            } catch (erro) {
                msgForm.className = 'msg erro';
                msgForm.textContent = 'Erro ao conectar com o servidor. Tente de novo.';
            }
        });

        carregarOpcoes();
    </script>
</body>

</html>
