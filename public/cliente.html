<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Navalha de Ouro — Agendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/estilo.css">
</head>

<body>
    <div class="stripes"></div>
    <header>
        <h1>Navalha de Ouro</h1>
        <div class="sub">Agende seu horário</div>
    </header>

    <main>
        <section class="card">
            <h2>Novo agendamento</h2>
            <form id="formAgendamento">
                <div class="full">
                    <label for="cliente">Seu nome</label>
                    <input type="text" id="cliente" required>
                </div>
                <div>
                    <label for="telefone">Telefone / WhatsApp</label>
                    <input type="tel" id="telefone" placeholder="(43) 90000-0000">
                </div>
                <div>
                    <label for="email">E-mail (pra confirmação)</label>
                    <input type="email" id="email" placeholder="opcional">
                </div>
                <div>
                    <label for="barbeiro">Barbeiro</label>
                    <select id="barbeiro" required></select>
                </div>
                <div>
                    <label for="servico">Serviço</label>
                    <select id="servico" required></select>
                </div>
                <div class="full">
                    <label>Data</label>
                    <div id="calendario" class="calendario">
                        <div class="calendario-topo">
                            <button type="button" id="mesAnterior" class="calendario-nav">‹</button>
                            <span id="calendarioMesAno"></span>
                            <button type="button" id="mesSeguinte" class="calendario-nav">›</button>
                        </div>
                        <div class="calendario-semana">
                            <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
                        </div>
                        <div id="calendarioDias" class="calendario-dias"></div>
                    </div>
                    <input type="hidden" id="data" required>
                </div>
                <div class="full">
                    <label>Horário</label>
                    <div id="gradeHorarios" class="grade-horarios">
                        <p class="vazio" style="padding:0;">Escolha barbeiro, serviço e data primeiro.</p>
                    </div>
                    <input type="hidden" id="hora" required>
                </div>
                <div class="msg" id="msgForm"></div>
                <button type="submit" class="btn-primary">Confirmar agendamento</button>
            </form>
        </section>
    </main>

    <script>
        const formAgendamento = document.getElementById('formAgendamento');
        const selectBarbeiro = document.getElementById('barbeiro');
        const selectServico = document.getElementById('servico');
        const inputData = document.getElementById('data');
        const msgForm = document.getElementById('msgForm');

        let servicos = [];
        let diasFechados = [];
        let horarioAbertura = '09:00';
        let horarioFechamento = '19:30';
        let intervaloMinutos = 30;
        let mesAtual = new Date();
        mesAtual.setDate(1);

        const nomesMeses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

        function formatarDataLocal(d) {
            const ano = d.getFullYear();
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const dia = String(d.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        function renderCalendario() {
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);

            document.getElementById('calendarioMesAno').textContent =
                `${nomesMeses[mesAtual.getMonth()]} ${mesAtual.getFullYear()}`;

            const primeiroDiaSemana = new Date(mesAtual.getFullYear(), mesAtual.getMonth(), 1).getDay();
            const totalDias = new Date(mesAtual.getFullYear(), mesAtual.getMonth() + 1, 0).getDate();

            const container = document.getElementById('calendarioDias');
            container.innerHTML = '';

            for (let i = 0; i < primeiroDiaSemana; i++) {
                container.appendChild(document.createElement('span'));
            }

            for (let dia = 1; dia <= totalDias; dia++) {
                const dataDia = new Date(mesAtual.getFullYear(), mesAtual.getMonth(), dia);
                const diaSemana = dataDia.getDay();
                const passou = dataDia < hoje;
                const fechado = diasFechados.includes(diaSemana);
                const indisponivel = passou || fechado;

                const botao = document.createElement('button');
                botao.type = 'button';
                botao.textContent = dia;
                botao.className = 'calendario-dia' + (indisponivel ? ' indisponivel' : '');
                if (inputData.value === formatarDataLocal(dataDia)) botao.classList.add('selecionado');

                if (!indisponivel) {
                    botao.addEventListener('click', () => {
                        inputData.value = formatarDataLocal(dataDia);
                        renderCalendario();
                        renderGradeHorarios();
                    });
                } else {
                    botao.disabled = true;
                }

                container.appendChild(botao);
            }
        }

        function minutosParaHora(min) {
            const h = String(Math.floor(min / 60)).padStart(2, '0');
            const m = String(min % 60).padStart(2, '0');
            return `${h}:${m}`;
        }

        function horaParaMinutos(hora) {
            const [h, m] = hora.split(':').map(Number);
            return h * 60 + m;
        }

        async function renderGradeHorarios() {
            const gradeHorarios = document.getElementById('gradeHorarios');
            const hora = document.getElementById('hora');
            hora.value = '';

            if (!inputData.value || !selectBarbeiro.value || !selectServico.value) {
                gradeHorarios.innerHTML = '<p class="vazio" style="padding:0;">Escolha barbeiro, serviço e data primeiro.</p>';
                return;
            }

            gradeHorarios.innerHTML = '<p class="vazio" style="padding:0;">Carregando horários...</p>';

            const servicoEscolhido = servicos.find(s => s.nome === selectServico.value);
            const duracao = servicoEscolhido ? servicoEscolhido.duracao : 30;

            const ocupados = await fetch(`/api/agendamentos?barbeiro=${encodeURIComponent(selectBarbeiro.value)}&data=${inputData.value}`)
                .then(r => r.json());

            const inicioMin = horaParaMinutos(horarioAbertura);
            const fimMin = horaParaMinutos(horarioFechamento);
            const hoje = new Date();
            const dataEscolhidaEhHoje = inputData.value === formatarDataLocal(hoje);

            gradeHorarios.innerHTML = '';
            let algumDisponivel = false;

            for (let min = inicioMin; min <= fimMin; min += intervaloMinutos) {
                const horaTexto = minutosParaHora(min);
                const fimSlot = min + duracao;

                const conflita = ocupados.some(ag => {
                    const inicioAg = horaParaMinutos(ag.hora);
                    const fimAg = inicioAg + ag.duracao;
                    return min < fimAg && fimSlot > inicioAg;
                });

                const passouDoHorario = dataEscolhidaEhHoje && min <= (hoje.getHours() * 60 + hoje.getMinutes());
                const ultrapassaFechamento = fimSlot > fimMin;
                const indisponivel = conflita || passouDoHorario || ultrapassaFechamento;

                if (!indisponivel) algumDisponivel = true;

                const botao = document.createElement('button');
                botao.type = 'button';
                botao.textContent = horaTexto;
                botao.className = 'horario-botao' + (indisponivel ? ' indisponivel' : '');
                botao.dataset.hora = horaTexto;

                if (!indisponivel) {
                    botao.addEventListener('click', () => {
                        hora.value = horaTexto;
                        gradeHorarios.querySelectorAll('.horario-botao').forEach(b => b.classList.remove('selecionado'));
                        botao.classList.add('selecionado');
                    });
                } else {
                    botao.disabled = true;
                }

                gradeHorarios.appendChild(botao);
            }

            if (!algumDisponivel) {
                gradeHorarios.innerHTML = '<p class="vazio" style="padding:0;">Nenhum horário disponível nesse dia.</p>';
            }
        }

        document.getElementById('mesAnterior').addEventListener('click', () => {
            mesAtual.setMonth(mesAtual.getMonth() - 1);
            renderCalendario();
        });
        document.getElementById('mesSeguinte').addEventListener('click', () => {
            mesAtual.setMonth(mesAtual.getMonth() + 1);
            renderCalendario();
        });

        async function carregarOpcoes() {
            const [barbeiros, servs, config] = await Promise.all([
                fetch('/api/barbeiros').then(r => r.json()),
                fetch('/api/servicos').then(r => r.json()),
                fetch('/api/configuracao').then(r => r.json())
            ]);
            servicos = servs;
            diasFechados = config.diasFechados || [];
            horarioAbertura = config.horarioAbertura || '09:00';
            horarioFechamento = config.horarioFechamento || '19:30';
            intervaloMinutos = config.intervaloMinutos || 30;
            selectBarbeiro.innerHTML = barbeiros.map(b => `<option value="${b}">${b}</option>`).join('');
            selectServico.innerHTML = servs.map(s => `<option value="${s.nome}">${s.nome} — ${s.duracao}min — R$${s.preco}</option>`).join('');
            renderCalendario();
            renderGradeHorarios();
        }

        selectBarbeiro.addEventListener('change', renderGradeHorarios);
        selectServico.addEventListener('change', renderGradeHorarios);

        formAgendamento.addEventListener('submit', async (e) => {
            e.preventDefault();
            msgForm.className = 'msg';
            msgForm.textContent = '';

            if (!inputData.value) {
                msgForm.className = 'msg erro';
                msgForm.textContent = 'Escolha uma data no calendário.';
                return;
            }
            if (!document.getElementById('hora').value) {
                msgForm.className = 'msg erro';
                msgForm.textContent = 'Escolha um horário disponível.';
                return;
            }

            const corpo = {
                cliente: document.getElementById('cliente').value.trim(),
                telefone: document.getElementById('telefone').value.trim(),
                email: document.getElementById('email').value.trim(),
                barbeiro: selectBarbeiro.value,
                servico: selectServico.value,
                data: inputData.value,
                hora: document.getElementById('hora').value
            };

            try {
                const resposta = await fetch('/api/agendamentos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(corpo)
                });
                const dados = await resposta.json();

                if (!resposta.ok) {
                    msgForm.className = 'msg erro';
                    msgForm.textContent = dados.erro || 'Não deu pra agendar. Tente outro horário.';
                    return;
                }

                msgForm.className = 'msg sucesso';
                msgForm.textContent = 'Agendamento confirmado com sucesso! Te esperamos por aqui.';
                formAgendamento.reset();
                inputData.value = '';
                renderCalendario();
                renderGradeHorarios();
            } catch (erro) {
                msgForm.className = 'msg erro';
                msgForm.textContent = 'Erro ao conectar com o servidor. Tente de novo.';
            }
        });

        carregarOpcoes();
    </script>
</body>

</html>
