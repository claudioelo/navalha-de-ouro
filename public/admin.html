<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navalha de Ouro — Administração</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/estilo.css">
</head>

<body>
    <div class="stripes"></div>
    <header>
        <h1>Navalha de Ouro</h1>
        <div class="sub">Administração</div>
    </header>

    <main>
        <div class="barra-usuario">
            <span>Logado como <strong>Administrador</strong></span>
            <a class="btn-desfazer link-botao" href="/barbeiro">ver agenda →</a>
        </div>

        <section class="card">
            <h2>Barbeiros</h2>
            <form id="formBarbeiro">
                <div>
                    <label for="novoBarbeiro">Nome do barbeiro</label>
                    <input type="text" id="novoBarbeiro" required maxlength="40">
                </div>
                <div>
                    <label for="novaSenhaBarbeiro">Senha inicial (opcional)</label>
                    <input type="password" id="novaSenhaBarbeiro" maxlength="50" autocomplete="new-password"
                        placeholder="mín. 6, sem acento">
                </div>
                <button type="submit" class="btn-primary">Adicionar barbeiro</button>
            </form>
            <p class="dica">O <strong>nome</strong> do barbeiro é o login dele no /barbeiro. Ele pode trocar a senha
                depois, lá dentro.</p>
            <div id="listaBarbeiros" style="margin-top:16px; display:grid; gap:8px;"></div>
        </section>

        <section class="card">
            <h2>Serviços</h2>
            <form id="formServico">
                <div class="full">
                    <label for="novoServicoNome">Nome do serviço</label>
                    <input type="text" id="novoServicoNome" required>
                </div>
                <div>
                    <label for="novoServicoDuracao">Duração (min)</label>
                    <input type="number" id="novoServicoDuracao" min="1" required>
                </div>
                <div>
                    <label for="novoServicoPreco">Preço (R$)</label>
                    <input type="number" id="novoServicoPreco" min="0" step="0.01" required>
                </div>
                <button type="submit" class="btn-primary">Adicionar serviço</button>
            </form>
            <div id="listaServicos" style="margin-top:16px; display:grid; gap:8px;"></div>
        </section>
    </main>

    <script>
        const formBarbeiro = document.getElementById('formBarbeiro');
        const formServico = document.getElementById('formServico');
        const listaBarbeiros = document.getElementById('listaBarbeiros');
        const listaServicos = document.getElementById('listaServicos');

        // SEGURANÇA: mostra os nomes como texto puro, nunca como código
        function esc(valor) {
            return String(valor ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Cada barbeiro: nome, se tem acesso ao /barbeiro, e os botões
        function renderBarbeiros(barbeiros) {
            listaBarbeiros.innerHTML = barbeiros.map(b => `
        <div class="item-barbeiro">
          <div class="item-linha">
            <span>${esc(b.nome)}
              <span class="status ${b.temAcesso ? 'status-atendido' : 'status-cancelado'}">${b.temAcesso ? 'com acesso' : 'sem acesso'}</span>
            </span>
            <span class="acoes">
              <button type="button" class="btn-atendido abrirSenha">${b.temAcesso ? 'trocar senha' : 'dar acesso'}</button>
              ${b.temAcesso ? `<button type="button" class="btn-desfazer tirarAcesso" data-nome="${esc(b.nome)}">tirar acesso</button>` : ''}
              <button type="button" data-nome="${esc(b.nome)}" class="removerBarbeiro btn-cancelar">remover</button>
            </span>
          </div>
          <form class="form-senha" data-nome="${esc(b.nome)}" hidden>
            <input type="password" maxlength="50" autocomplete="new-password" placeholder="Nova senha (mín. 6, sem acento)" required>
            <button type="submit" class="btn-atendido">salvar</button>
          </form>
        </div>`
            ).join('') || '<p class="vazio" style="padding:0;">Nenhum barbeiro cadastrado</p>';

            // "dar acesso" / "trocar senha": mostra o campinho de senha embaixo do nome
            listaBarbeiros.querySelectorAll('.abrirSenha').forEach(btn => {
                btn.addEventListener('click', () => {
                    const form = btn.closest('.item-barbeiro').querySelector('.form-senha');
                    form.hidden = !form.hidden;
                    if (!form.hidden) form.querySelector('input').focus();
                });
            });

            listaBarbeiros.querySelectorAll('.form-senha').forEach(form => {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const senha = form.querySelector('input').value;
                    const ok = await mudarSenha(form.dataset.nome, senha);
                    if (ok) alert(`Senha de ${form.dataset.nome} salva! Login: ${form.dataset.nome}`);
                });
            });

            listaBarbeiros.querySelectorAll('.tirarAcesso').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm(`Tirar o acesso de ${btn.dataset.nome}? Ele continua aparecendo pros clientes, mas não entra mais no /barbeiro.`)) return;
                    await mudarSenha(btn.dataset.nome, null);
                });
            });

            listaBarbeiros.querySelectorAll('.removerBarbeiro').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm(`Remover o barbeiro ${btn.dataset.nome}? Ele some da lista de agendamento.`)) return;
                    await fetch(`/api/barbeiros/${encodeURIComponent(btn.dataset.nome)}`, { method: 'DELETE' });
                    carregarBarbeiros();
                });
            });
        }

        // senha = texto pra definir, ou null pra tirar o acesso
        async function mudarSenha(nome, senha) {
            const resposta = await fetch(`/api/barbeiros/${encodeURIComponent(nome)}/senha`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senha })
            });
            if (!resposta.ok) {
                const erro = await resposta.json().catch(() => ({}));
                alert(erro.erro || 'Não deu pra salvar a senha.');
                return false;
            }
            carregarBarbeiros();
            return true;
        }

        function renderServicos(servicos) {
            listaServicos.innerHTML = servicos.map(s =>
                `<div style="display:flex;justify-content:space-between;align-items:center;">
          <span>${esc(s.nome)} <span class="tag">${esc(s.duracao)}min · R$${esc(s.preco)}</span></span>
          <button data-nome="${esc(s.nome)}" class="removerServico btn-cancelar">remover</button>
        </div>`
            ).join('') || '<p class="vazio" style="padding:0;">Nenhum serviço cadastrado</p>';

            listaServicos.querySelectorAll('.removerServico').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm(`Remover o serviço ${btn.dataset.nome}?`)) return;
                    await fetch(`/api/servicos/${encodeURIComponent(btn.dataset.nome)}`, { method: 'DELETE' });
                    carregarServicos();
                });
            });
        }

        async function carregarBarbeiros() {
            const barbeiros = await fetch('/api/barbeiros/acessos').then(r => r.json());
            renderBarbeiros(barbeiros);
        }

        async function carregarServicos() {
            const servicos = await fetch('/api/servicos').then(r => r.json());
            renderServicos(servicos);
        }

        formBarbeiro.addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('novoBarbeiro');
            const inputSenha = document.getElementById('novaSenhaBarbeiro');
            const nome = input.value.trim();
            if (!nome) return;

            const resposta = await fetch('/api/barbeiros', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, senha: inputSenha.value })
            });
            if (resposta.ok) {
                input.value = '';
                inputSenha.value = '';
                carregarBarbeiros();
            } else {
                const erro = await resposta.json();
                alert(erro.erro || 'Erro ao cadastrar barbeiro.');
            }
        });

        formServico.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('novoServicoNome').value.trim();
            const duracao = Number(document.getElementById('novoServicoDuracao').value);
            const preco = Number(document.getElementById('novoServicoPreco').value);

            const resposta = await fetch('/api/servicos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, duracao, preco })
            });
            if (resposta.ok) {
                formServico.reset();
                carregarServicos();
            } else {
                const erro = await resposta.json();
                alert(erro.erro || 'Erro ao cadastrar serviço.');
            }
        });

        carregarBarbeiros();
        carregarServicos();
    </script>
</body>

</html>
