<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navalha de Ouro — Agenda do Barbeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/estilo.css">
</head>

<body>
    <div class="stripes"></div>
    <header>
        <h1>Navalha de Ouro</h1>
        <div class="sub">Agenda do barbeiro</div>
    </header>

    <main>
        <!-- Barrinha de quem está logado + trocar senha -->
        <div class="barra-usuario" id="barraUsuario" hidden>
            <span>Logado como <strong id="nomeLogado"></strong></span>
            <button type="button" class="btn-desfazer" id="btnTrocarSenha" hidden>trocar minha senha</button>
        </div>

        <section class="card" id="cardSenha" hidden>
            <h2>Trocar minha senha</h2>
            <form id="formSenha">
                <div class="full">
                    <label for="senhaAtual">Senha atual</label>
                    <input type="password" id="senhaAtual" required autocomplete="current-password">
                </div>
                <div>
                    <label for="senhaNova">Nova senha</label>
                    <input type="password" id="senhaNova" required minlength="6" maxlength="50" autocomplete="new-password">
                </div>
                <div>
                    <label for="senhaConfirma">Repetir nova senha</label>
                    <input type="password" id="senhaConfirma" required minlength="6" maxlength="50" autocomplete="new-password">
                </div>
                <p class="dica full">Mínimo 6 caracteres, sem espaço e sem acento. Depois de trocar, o navegador vai
                    pedir pra entrar de novo com a senha nova.</p>
                <div class="msg" id="msgSenha"></div>
                <button type="submit" class="btn-primary">Salvar nova senha</button>
            </form>
        </section>

        <section class="card">
            <h2>Horários marcados</h2>
            <div class="filtros">
                <div id="campoFiltroBarbeiro">
                    <label for="filtroBarbeiro">Barbeiro</label>
                    <select id="filtroBarbeiro"><option value="">Todos</option></select>
                </div>
                <div>
                    <label for="filtroData">Data</label>
                    <input type="date" id="filtroData">
                </div>
            </div>
            <div id="tabelaWrap"><p class="vazio">Carregando...</p></div>
            <p class="aviso-auto">Atualiza sozinho a cada 10 segundos</p>
        </section>
    </main>

    <script>
        const filtroBarbeiro = document.getElementById('filtroBarbeiro');
        const filtroData = document.getElementById('filtroData');
        const tabelaWrap = document.getElementById('tabelaWrap');

        // SEGURANÇA: transforma texto em "texto puro" antes de colocar na página.
        // Sem isso, um cliente podia agendar com um código no lugar do nome
        // e esse código rodaria aqui, no celular do barbeiro logado.
        function esc(valor) {
            return String(valor ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        async function carregarBarbeiros() {
            const barbeiros = await fetch('/api/barbeiros').then(r => r.json());
            const selecionado = filtroBarbeiro.value;
            filtroBarbeiro.innerHTML = '<option value="">Todos</option>' +
                barbeiros.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
            filtroBarbeiro.value = selecionado;
        }

        function formatarData(iso) {
            const [ano, mes, dia] = iso.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        // Quais botões aparecem em cada linha, dependendo do status
        function botoesDoStatus(a) {
            if (a.status === 'agendado') {
                return `<button class="btn-atendido" data-id="${a.id}" data-novo-status="atendido">atendido</button>
                        <button class="btn-cancelar" data-id="${a.id}" data-novo-status="cancelado">cancelar</button>`;
            }
            // Atendido ou cancelado: dá pra desfazer se clicou errado
            return `<button class="btn-desfazer" data-id="${a.id}" data-novo-status="agendado">desfazer</button>`;
        }

        async function carregarAgenda() {
            const params = new URLSearchParams();
            if (filtroBarbeiro.value) params.set('barbeiro', filtroBarbeiro.value);
            if (filtroData.value) params.set('data', filtroData.value);

            params.set('todos', '1'); // mostra também os cancelados
            const resposta = await fetch(`/api/agendamentos?${params}`);
            if (resposta.status === 401) {
                // Login perdido: recarrega a página pra pedir a senha de novo
                location.reload();
                return;
            }
            if (!resposta.ok) {
                const erro = await resposta.json().catch(() => ({}));
                tabelaWrap.innerHTML = `<p class="vazio">${esc(erro.erro || 'Erro ao carregar a agenda.')}</p>`;
                return;
            }
            const lista = await resposta.json();

            if (lista.length === 0) {
                tabelaWrap.innerHTML = '<p class="vazio">Nenhum agendamento encontrado.</p>';
                return;
            }

            tabelaWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Data</th><th>Hora</th><th>Cliente</th><th>Telefone</th><th>Barbeiro</th><th>Serviço</th><th>Preço</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${lista.map(a => `
              <tr class="linha-${esc(a.status)}">
                <td>${esc(formatarData(a.data))}</td>
                <td>${esc(a.hora)}</td>
                <td>${esc(a.cliente)}</td>
                <td>${esc(a.telefone) || '—'}</td>
                <td>${esc(a.barbeiro)}</td>
                <td>${esc(a.servico)}</td>
                <td>R$${esc(a.preco)}</td>
                <td><span class="status status-${esc(a.status)}">${esc(a.status)}</span></td>
                <td class="acoes">${botoesDoStatus(a)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

            // Cada botão tem o id do agendamento e o status novo que ele aplica
            tabelaWrap.querySelectorAll('[data-novo-status]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const novo = btn.dataset.novoStatus;
                    if (novo === 'cancelado' && !confirm('Cancelar esse agendamento?')) return;

                    const resposta = await fetch(`/api/agendamentos/${btn.dataset.id}/status`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: novo })
                    });
                    if (!resposta.ok) {
                        const erro = await resposta.json();
                        alert(erro.erro || 'Não deu pra mudar o status.');
                    }
                    carregarAgenda();
                });
            });
        }

        filtroBarbeiro.addEventListener('change', carregarAgenda);
        filtroData.addEventListener('change', carregarAgenda);

        // ---------- Quem está logado ----------
        async function carregarUsuario() {
            const resposta = await fetch('/api/eu');
            if (!resposta.ok) return;
            const eu = await resposta.json();

            const nomes = { admin: 'Administrador', recepcao: 'Recepção' };
            document.getElementById('nomeLogado').textContent = eu.tipo === 'barbeiro' ? eu.nome : nomes[eu.tipo];
            document.getElementById('barraUsuario').hidden = false;

            if (eu.tipo === 'barbeiro') {
                // Barbeiro vê só a agenda dele: não precisa do filtro de barbeiro
                document.getElementById('campoFiltroBarbeiro').hidden = true;
                document.getElementById('btnTrocarSenha').hidden = false;
            }
        }

        // ---------- Trocar a própria senha ----------
        document.getElementById('btnTrocarSenha').addEventListener('click', () => {
            const card = document.getElementById('cardSenha');
            card.hidden = !card.hidden;
            if (!card.hidden) document.getElementById('senhaAtual').focus();
        });

        document.getElementById('formSenha').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msgSenha');
            const atual = document.getElementById('senhaAtual').value;
            const nova = document.getElementById('senhaNova').value;

            if (nova !== document.getElementById('senhaConfirma').value) {
                msg.className = 'msg erro';
                msg.textContent = 'As duas senhas novas não são iguais.';
                return;
            }

            const resposta = await fetch('/api/eu/senha', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ atual, nova })
            });
            const dados = await resposta.json().catch(() => ({}));
            if (!resposta.ok) {
                msg.className = 'msg erro';
                msg.textContent = dados.erro || 'Não deu pra trocar a senha.';
                return;
            }
            msg.className = 'msg sucesso';
            msg.textContent = 'Senha trocada! Entre de novo com a senha nova.';
            document.getElementById('formSenha').reset();
            setTimeout(() => location.reload(), 2000); // o navegador pede o login de novo
        });

        async function iniciar() {
            await carregarUsuario();
            await carregarBarbeiros();
            await carregarAgenda();
        }

        iniciar();
        setInterval(carregarAgenda, 10000);
    </script>
</body>

</html>
