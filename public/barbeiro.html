<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navalha de Ouro — Agenda do Barbeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/estilo.css">
</head>

<body>
    <div class="stripes"></div>
    <header>
        <h1>Navalha de Ouro</h1>
        <div class="sub">Agenda do barbeiro</div>
    </header>

    <main>
        <!-- Barrinha de quem está logado + trocar senha -->
        <div class="barra-usuario" id="barraUsuario" hidden>
            <span>Logado como <strong id="nomeLogado"></strong></span>
            <span class="acoes">
                <button type="button" class="btn-atendido" id="btnNovo">+ novo agendamento</button>
                <button type="button" class="btn-desfazer" id="btnTrocarSenha" hidden>trocar minha senha</button>
                <a class="btn-desfazer link-botao" id="linkAdmin" href="/admin" hidden>administração →</a>
            </span>
        </div>

        <!-- Agendamento na hora (cliente que chegou no balcão ou ligou) -->
        <section class="card" id="cardNovo" hidden>
            <h2>Novo agendamento</h2>
            <form id="formNovo">
                <div>
                    <label for="novoCliente">Nome do cliente</label>
                    <input type="text" id="novoCliente" required minlength="2" maxlength="60">
                </div>
                <div>
                    <label for="novoTelefone">Telefone (opcional)</label>
                    <input type="tel" id="novoTelefone" maxlength="20" placeholder="(43) 90000-0000">
                </div>
                <div id="campoNovoBarbeiro">
                    <label for="novoBarbeiro">Barbeiro</label>
                    <select id="novoBarbeiro"></select>
                </div>
                <div>
                    <label for="novoServico">Serviço</label>
                    <select id="novoServico"></select>
                </div>
                <div>
                    <label for="novoData">Dia</label>
                    <input type="date" id="novoData" required>
                </div>
                <div>
                    <label for="novoHora">Horário</label>
                    <select id="novoHora" required></select>
                </div>
                <div class="msg" id="msgNovo"></div>
                <button type="submit" class="btn-primary">Confirmar agendamento</button>
            </form>
        </section>

        <section class="card" id="cardSenha" hidden>
            <h2>Trocar minha senha</h2>
            <form id="formSenha">
                <div class="full">
                    <label for="senhaAtual">Senha atual</label>
                    <input type="password" id="senhaAtual" required autocomplete="current-password">
                </div>
                <div>
                    <label for="senhaNova">Nova senha</label>
                    <input type="password" id="senhaNova" required minlength="6" maxlength="50" autocomplete="new-password">
                </div>
                <div>
                    <label for="senhaConfirma">Repetir nova senha</label>
                    <input type="password" id="senhaConfirma" required minlength="6" maxlength="50" autocomplete="new-password">
                </div>
                <p class="dica full">Mínimo 6 caracteres, sem espaço e sem acento. Depois de trocar, o navegador vai
                    pedir pra entrar de novo com a senha nova.</p>
                <div class="msg" id="msgSenha"></div>
                <button type="submit" class="btn-primary">Salvar nova senha</button>
            </form>
        </section>

        <section class="card">
            <h2>Horários marcados</h2>
            <div class="filtros">
                <div id="campoFiltroBarbeiro">
                    <label for="filtroBarbeiro">Barbeiro</label>
                    <select id="filtroBarbeiro"><option value="">Todos</option></select>
                </div>
                <div>
                    <label for="filtroData">Data</label>
                    <input type="date" id="filtroData">
                </div>
            </div>
            <div id="tabelaWrap"><p class="vazio">Carregando...</p></div>
            <p class="aviso-auto">Atualiza sozinho a cada 10 segundos</p>
        </section>
    </main>

    <script>
        const filtroBarbeiro = document.getElementById('filtroBarbeiro');
        const filtroData = document.getElementById('filtroData');
        const tabelaWrap = document.getElementById('tabelaWrap');

        // SEGURANÇA: transforma texto em "texto puro" antes de colocar na página.
        // Sem isso, um cliente podia agendar com um código no lugar do nome
        // e esse código rodaria aqui, no celular do barbeiro logado.
        function esc(valor) {
            return String(valor ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        async function carregarBarbeiros() {
            const barbeiros = await fetch('/api/barbeiros').then(r => r.json());
            const selecionado = filtroBarbeiro.value;
            filtroBarbeiro.innerHTML = '<option value="">Todos</option>' +
                barbeiros.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
            filtroBarbeiro.value = selecionado;
        }

        // Só os números do telefone, sem o +55 (ex: "(43) 98836-5410" -> "43988365410")
        function soNumeros(telefone) {
            let d = String(telefone || '').replace(/\D/g, '');
            if ((d.length === 12 || d.length === 13) && d.startsWith('55')) d = d.slice(2);
            return d;
        }

        function formatarTelefone(telefone) {
            const d = soNumeros(telefone);
            if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
            if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
            return telefone; // formato estranho: mostra como veio
        }

        // Telefone vira link do WhatsApp, já com a mensagem escrita
        function linkWhatsapp(a) {
            if (!a.telefone) return '—';
            const d = soNumeros(a.telefone);
            if (d.length !== 10 && d.length !== 11) return esc(a.telefone);
            const primeiroNome = String(a.cliente).trim().split(' ')[0];
            const texto = `Olá ${primeiroNome}, aqui é da Navalha de Ouro sobre o seu horário de ${formatarData(a.data).slice(0, 5)} às ${a.hora}.`;
            return `<a class="link-zap" href="https://wa.me/55${d}?text=${encodeURIComponent(texto)}" target="_blank" rel="noopener">${esc(formatarTelefone(a.telefone))}</a>`;
        }

        // Formata o telefone enquanto a pessoa digita: 43988365410 -> (43) 98836-5410
        function mascaraTelefone(input) {
            input.addEventListener('input', () => {
                const d = input.value.replace(/\D/g, '').slice(0, 11);
                let v = d;
                if (d.length > 2) v = `(${d.slice(0, 2)}) ${d.slice(2)}`;
                if (d.length > 6) v = `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}`;
                input.value = v;
            });
        }

        function formatarData(iso) {
            const [ano, mes, dia] = iso.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        // Quais botões aparecem em cada linha, dependendo do status
        function botoesDoStatus(a) {
            if (a.status === 'agendado') {
                return `<button class="btn-atendido" data-id="${a.id}" data-novo-status="atendido">atendido</button>
                        <button class="btn-cancelar" data-id="${a.id}" data-novo-status="cancelado">cancelar</button>`;
            }
            // Atendido ou cancelado: dá pra desfazer se clicou errado
            return `<button class="btn-desfazer" data-id="${a.id}" data-novo-status="agendado">desfazer</button>`;
        }

        async function carregarAgenda() {
            const params = new URLSearchParams();
            if (filtroBarbeiro.value) params.set('barbeiro', filtroBarbeiro.value);
            if (filtroData.value) params.set('data', filtroData.value);

            params.set('todos', '1'); // mostra também os cancelados
            const resposta = await fetch(`/api/agendamentos?${params}`);
            if (resposta.status === 401) {
                // Login perdido: recarrega a página pra pedir a senha de novo
                location.reload();
                return;
            }
            if (!resposta.ok) {
                const erro = await resposta.json().catch(() => ({}));
                tabelaWrap.innerHTML = `<p class="vazio">${esc(erro.erro || 'Erro ao carregar a agenda.')}</p>`;
                return;
            }
            const lista = await resposta.json();

            if (lista.length === 0) {
                tabelaWrap.innerHTML = '<p class="vazio">Nenhum agendamento encontrado.</p>';
                return;
            }

            tabelaWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Data</th><th>Hora</th><th>Cliente</th><th>Telefone</th><th>Barbeiro</th><th>Serviço</th><th>Preço</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${lista.map(a => `
              <tr class="linha-${esc(a.status)}">
                <td>${esc(formatarData(a.data))}</td>
                <td>${esc(a.hora)}</td>
                <td>${esc(a.cliente)}${a.origem === 'balcao' ? ' <span class="tag">balcão</span>' : ''}</td>
                <td>${linkWhatsapp(a)}</td>
                <td>${esc(a.barbeiro)}</td>
                <td>${esc(a.servico)}</td>
                <td>R$${esc(a.preco)}</td>
                <td><span class="status status-${esc(a.status)}">${esc(a.status)}</span></td>
                <td class="acoes">${botoesDoStatus(a)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

            // Cada botão tem o id do agendamento e o status novo que ele aplica
            tabelaWrap.querySelectorAll('[data-novo-status]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const novo = btn.dataset.novoStatus;
                    if (novo === 'cancelado' && !confirm('Cancelar esse agendamento?')) return;

                    const resposta = await fetch(`/api/agendamentos/${btn.dataset.id}/status`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: novo })
                    });
                    if (!resposta.ok) {
                        const erro = await resposta.json();
                        alert(erro.erro || 'Não deu pra mudar o status.');
                    }
                    carregarAgenda();
                });
            });
        }

        filtroBarbeiro.addEventListener('change', carregarAgenda);
        filtroData.addEventListener('change', carregarAgenda);

        // ---------- Quem está logado ----------
        async function carregarUsuario() {
            // Tenta até 3 vezes (se o servidor estiver no meio de uma atualização, a 1ª pode falhar)
            let resposta;
            for (let tentativa = 1; tentativa <= 3; tentativa++) {
                resposta = await fetch('/api/eu').catch(() => null);
                if (resposta?.ok) break;
                if (resposta?.status === 401) { location.reload(); return; } // login perdido
                await new Promise(r => setTimeout(r, 2000));
            }
            if (!resposta?.ok) return;
            const eu = await resposta.json();
            usuario = eu;

            const nomes = { admin: 'Administrador', recepcao: 'Recepção' };
            document.getElementById('nomeLogado').textContent = eu.tipo === 'barbeiro' ? eu.nome : nomes[eu.tipo];
            document.getElementById('barraUsuario').hidden = false;

            if (eu.tipo === 'admin') document.getElementById('linkAdmin').hidden = false;

            if (eu.tipo === 'barbeiro') {
                // Barbeiro vê só a agenda dele: não precisa do filtro de barbeiro
                document.getElementById('campoFiltroBarbeiro').hidden = true;
                document.getElementById('btnTrocarSenha').hidden = false;
            }
        }

        // ---------- Agendamento na hora ----------
        let usuario = null;   // quem está logado (preenchido em carregarUsuario)
        let servicos = [];
        let config = {};

        // Data de hoje no formato do input (2026-11-05), pelo relógio do celular/PC
        function hojeISO() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function horaParaMinutos(hora) {
            const [h, m] = hora.split(':').map(Number);
            return h * 60 + m;
        }

        function minutosParaHora(min) {
            return `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
        }

        async function prepararNovoAgendamento() {
            const [servs, conf, barbeiros] = await Promise.all([
                fetch('/api/servicos').then(r => r.json()),
                fetch('/api/configuracao').then(r => r.json()),
                fetch('/api/barbeiros').then(r => r.json())
            ]);
            servicos = servs;
            config = conf;

            document.getElementById('novoServico').innerHTML = servs.map(s =>
                `<option value="${esc(s.nome)}">${esc(s.nome)} — ${esc(s.duracao)}min — R$${esc(s.preco)}</option>`).join('');

            // Barbeiro marca só pra ele; recepção/admin escolhem
            const selectBarbeiro = document.getElementById('novoBarbeiro');
            if (usuario?.tipo === 'barbeiro') {
                selectBarbeiro.innerHTML = `<option value="${esc(usuario.nome)}">${esc(usuario.nome)}</option>`;
                document.getElementById('campoNovoBarbeiro').hidden = true;
            } else {
                selectBarbeiro.innerHTML = barbeiros.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
            }

            const inputData = document.getElementById('novoData');
            inputData.min = hojeISO();
            const limite = new Date();
            limite.setDate(limite.getDate() + (conf.diasAntecedenciaMaxima || 60));
            inputData.max = `${limite.getFullYear()}-${String(limite.getMonth() + 1).padStart(2, '0')}-${String(limite.getDate()).padStart(2, '0')}`;
            if (!inputData.value) inputData.value = hojeISO();

            await montarHorarios();
        }

        // Lista só os horários livres do barbeiro naquele dia
        async function montarHorarios() {
            const selectHora = document.getElementById('novoHora');
            const barbeiro = document.getElementById('novoBarbeiro').value;
            const data = document.getElementById('novoData').value;
            const servico = servicos.find(s => s.nome === document.getElementById('novoServico').value);
            if (!barbeiro || !data || !servico) {
                selectHora.innerHTML = '';
                return;
            }

            const diaDaSemana = new Date(`${data}T12:00:00`).getDay();
            if ((config.diasFechados || []).includes(diaDaSemana)) {
                selectHora.innerHTML = '<option value="">Fechado nesse dia</option>';
                return;
            }

            const ocupados = await fetch(`/api/agendamentos?barbeiro=${encodeURIComponent(barbeiro)}&data=${data}`).then(r => r.json());
            const abertura = horaParaMinutos(config.horarioAbertura || '09:00');
            const fechamento = horaParaMinutos(config.horarioFechamento || '19:30');
            const intervalo = config.intervaloMinutos || 30;
            const agora = new Date();
            const agoraMin = agora.getHours() * 60 + agora.getMinutes();
            const ehHoje = data === hojeISO();

            const opcoes = [];
            let sugerido = null;
            for (let min = abertura; min + servico.duracao <= fechamento; min += intervalo) {
                const conflita = ocupados.some(ag => {
                    const inicio = horaParaMinutos(ag.hora);
                    return min < inicio + ag.duracao && min + servico.duracao > inicio;
                });
                if (conflita) continue;
                const jaPassou = ehHoje && min + intervalo <= agoraMin; // esse horário inteiro já acabou
                if (!jaPassou && sugerido === null) sugerido = min;    // o mais próximo de agora
                const texto = minutosParaHora(min);
                opcoes.push(`<option value="${texto}">${texto}${jaPassou ? ' (já passou)' : ''}</option>`);
            }

            if (!opcoes.length) {
                selectHora.innerHTML = '<option value="">Nenhum horário livre</option>';
            } else if (sugerido !== null) {
                selectHora.innerHTML = opcoes.join('');
                selectHora.value = minutosParaHora(sugerido); // já deixa o mais próximo de agora
            } else {
                // Todos os horários do dia já passaram: obriga a escolher (pra ninguém marcar sem querer)
                selectHora.innerHTML = '<option value="">Escolha o horário</option>' + opcoes.join('');
            }
        }

        ['novoBarbeiro', 'novoServico', 'novoData'].forEach(id =>
            document.getElementById(id).addEventListener('change', montarHorarios));

        document.getElementById('btnNovo').addEventListener('click', async () => {
            const card = document.getElementById('cardNovo');
            card.hidden = !card.hidden;
            if (!card.hidden) {
                await prepararNovoAgendamento();
                document.getElementById('novoCliente').focus();
            }
        });

        document.getElementById('formNovo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msgNovo');
            const hora = document.getElementById('novoHora').value;
            if (!hora) {
                msg.className = 'msg erro';
                msg.textContent = 'Escolha um horário livre.';
                return;
            }

            const resposta = await fetch('/api/agendamentos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cliente: document.getElementById('novoCliente').value.trim(),
                    telefone: document.getElementById('novoTelefone').value.trim(),
                    barbeiro: document.getElementById('novoBarbeiro').value,
                    servico: document.getElementById('novoServico').value,
                    data: document.getElementById('novoData').value,
                    hora
                })
            });
            const dados = await resposta.json().catch(() => ({}));
            if (!resposta.ok) {
                msg.className = 'msg erro';
                msg.textContent = dados.erro || 'Não deu pra agendar.';
                return;
            }

            msg.className = 'msg sucesso';
            msg.textContent = `Agendado: ${dados.cliente} — ${formatarData(dados.data)} às ${dados.hora} com ${dados.barbeiro}.`;
            document.getElementById('novoCliente').value = '';
            document.getElementById('novoTelefone').value = '';
            await montarHorarios();
            carregarAgenda();
        });

        // ---------- Trocar a própria senha ----------
        document.getElementById('btnTrocarSenha').addEventListener('click', () => {
            const card = document.getElementById('cardSenha');
            card.hidden = !card.hidden;
            if (!card.hidden) document.getElementById('senhaAtual').focus();
        });

        document.getElementById('formSenha').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msgSenha');
            const atual = document.getElementById('senhaAtual').value;
            const nova = document.getElementById('senhaNova').value;

            if (nova !== document.getElementById('senhaConfirma').value) {
                msg.className = 'msg erro';
                msg.textContent = 'As duas senhas novas não são iguais.';
                return;
            }

            const resposta = await fetch('/api/eu/senha', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ atual, nova })
            });
            const dados = await resposta.json().catch(() => ({}));
            if (!resposta.ok) {
                msg.className = 'msg erro';
                msg.textContent = dados.erro || 'Não deu pra trocar a senha.';
                return;
            }
            msg.className = 'msg sucesso';
            msg.textContent = 'Senha trocada! Entre de novo com a senha nova.';
            document.getElementById('formSenha').reset();
            setTimeout(() => location.reload(), 2000); // o navegador pede o login de novo
        });

        mascaraTelefone(document.getElementById('novoTelefone'));

        async function iniciar() {
            await carregarUsuario();
            await carregarBarbeiros();
            await carregarAgenda();
        }

        iniciar();
        setInterval(carregarAgenda, 10000);
    </script>
</body>

</html>
